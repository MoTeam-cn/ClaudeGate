name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

  # 同一个网关必须也能跑在 Bun 上：BoringSSL 的 TLS 指纹才对得上真 Claude Code。
  # 这条不加的话，Bun 兼容会悄悄烂掉。
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx tsc --noEmit

      - name: 测试
        run: bun test/run-all.ts

  # 镜像必须真能构建、真能起来。Dockerfile 换了基础镜像之后，
  # 只跑 bun test 是测不到 COPY 路径、权限、健康检查这些的。
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t claudegate:ci .

      - name: 起容器并等健康检查
        run: |
          docker run -d --name cg -p 8800:8800 \
            -e ADMIN_TOKEN=ci-admin-token \
            -e SECRET=ci-secret-ci-secret-ci-secret \
            claudegate:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8800/healthz > /dev/null; then
              echo "健康检查通过（第 $i 次）"
              exit 0
            fi
            sleep 1
          done
          echo "容器 30 秒内没通过健康检查"
          docker logs cg
          exit 1

      - name: 面板页可达
        run: curl -fsS "http://127.0.0.1:8800/panel?key=ci-admin-token" | head -c 200
